[project]
name = "zdroje-mcp"
version = "0.1.0"
description = "Remote MCP server: Banská Bystrica news sources, Denník N and MsZ eGOV documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "feedparser>=6.0",
    "uvicorn>=0.30",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
zdroje-indexer = "zdroje.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zdroje"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
